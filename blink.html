<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>blink</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    p {
      font-family: monospace;
      font-size: 4rem;
      color: #fff;
      animation: blink 1s step-start infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <p>blink</p>
</body>
</html>
