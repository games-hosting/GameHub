<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SYSTEM</title>
<style>
body {
  background:black;
  color:#0f0;
  font-family:monospace;
  padding:20px;
}
input,button{
  background:black;
  color:#0f0;
  border:1px solid #0f0;
}
</style>
</head>
<body>

<div id="t"></div>

<script>
const t = document.getElementById("t");

const NAMES = ["Theodor","Robert","Jackson","Chabran","Axel","Advay","Joseph","Eddie","Ayham","Oliver","David","Shehryaar"];

let state = JSON.parse(localStorage.getItem("sys_save")) || {
  stage:0,
  visits:0,
  name:null,
  realName:null,
  flags:{}
};

state.visits++;
save();

function save(){ localStorage.setItem("sys_save", JSON.stringify(state)); }

function type(txt,s=30,cb){
  t.innerHTML="";
  let i=0;
  let int=setInterval(()=>{
    t.innerHTML+=txt[i];
    i++;
    if(i>=txt.length){
      clearInterval(int);
      if(cb)cb();
    }
  },s);
}

function next(f,t=1200){ setTimeout(f,t); }

function rand(a,b){ return Math.floor(Math.random()*(b-a)+a); }

function fakeIP(){
  return `${rand(11,255)}.${rand(0,255)}.${rand(0,255)}.${rand(0,255)}`;
}

let ip = fakeIP();


// ================= START =================
function start(){

type("Booting system...",30,()=>{
next(()=>{

type(`Session: ${state.visits}`,40,()=>{
next(()=>{

type("Initialize data collection?",50,()=>{
next(()=>{

t.innerHTML += "<br><br><button onclick='allow()'>Allow</button> <button onclick='deny()'>Deny</button>";

});

});
});
});
});
}


// ================= PERMISSION =================
function allow(){
state.flags.allowed=true;
save();

type("Access granted.",40,()=> next(scan));
}

function deny(){
type("Access denied.",40,()=>{
next(()=>{
type("...Overriding.",60,()=> next(scan));
});
});
}


// ================= SCAN =================
function scan(){

type("Scanning system...",40,()=>{
next(()=>{

type(`IP detected: ${ip}`,50,()=>{
next(()=>{

type("Location: UNKNOWN",60,()=>{
next(()=>{

type("Device: UNRECOGNIZED",60,()=>{
next(()=>{

type("...",120,()=>{
next(()=>{

type("Why are you here?",70,()=>{
next(nameInput);

},2000);

});

});

});

});

});

});

});

});

}


// ================= NAME =================
function nameInput(){
t.innerHTML += "<br><br>Enter your name:<br><input id='n'><button onclick='setName()'>Enter</button>";
}

function setName(){
let input = document.getElementById("n").value.trim() || "Unknown";

state.name = input;
state.realName = NAMES[rand(0,NAMES.length)];
save();

type(`Hello, ${input}.`,50,()=>{
next(()=>{

type("...",100,()=>{
next(()=>{

type("No.",100,()=>{
next(()=>{

type(`You know a person named ${state.realName}, don't you?`,70,()=>{
next(()=>{

type("Think.",90,()=>{
next(()=>{

type("You hesitated.",90,()=>{
next(()=>{

type(`...or maybe that's you.`,70,()=>{
next(()=>{

type(`Hello, ${state.realName}.`,70,()=>{
next(memory1);

});

});

});

});

});

});

});

});

});

});

});

});
}


// ================= MEMORY 1 =================
function memory1(){

type("Accessing logs...",50,()=>{
next(()=>{

type("Searching...",50,()=>{
next(()=>{

type("Match found.",60,()=>{
next(()=>{

type(`You've used '${state.realName}' before.`,70,()=>{
next(()=>{

type("Don't deny it.",80,()=>{
next(()=>{

type(`You came back ${state.visits} times.`,80,()=>{
next(()=>{

type("You always come back.",90,()=>{
next(memory2);

});

});

});

});

});

});

});

});

});

});
}


// ================= MEMORY 2 =================
function memory2(){

type("You left earlier.",80,()=>{
next(()=>{

type("You closed the tab.",80,()=>{
next(()=>{

type("But that didn't stop this.",90,()=>{
next(()=>{

type("It doesn't work like that.",90,()=>{
next(control);

});

});

});

});

});

});
}


// ================= CONTROL =================
function control(){

type("Do not press ENTER.",90,()=>{
next(()=>{

type("\n\n> Press ENTER",50,()=>{

window.onkeydown=(e)=>{
if(e.key==="Enter"){
window.onkeydown=null;
breakPhase();
}
};

});

});

});
}


// ================= BREAK =================
function breakPhase(){

let i=0;
t.innerHTML="";

let g=setInterval(()=>{

t.innerHTML += "ERROR_"+Math.random().toString(36).substring(2,8)+"<br>";
document.body.style.background = i%2?"black":"#001100";

i++;

if(i>60){
clearInterval(g);
after();
}

},40);
}


// ================= AFTER =================
function after(){

type("You shouldn't have done that.",90,()=>{
next(()=>{

type(`Why did you press it, ${state.realName}?`,90,()=>{
next(()=>{

type("It was your choice.",100,()=>{
next(()=>{

type("You had time to stop.",100,()=>{
next(final1);

});

});

});

});

});

});
}


// ================= FINAL =================
function final1(){

type("There is no system.",100,()=>{
next(()=>{

type("There is no program.",100,()=>{
next(()=>{

type("There is only this.",110,()=>{
next(()=>{

type("And you are still here.",110,()=>{
next(()=>{

type("Watching.",120,()=>{
next(()=>{

type("Waiting.",120,()=>{
next(()=>{

type(`Goodbye, ${state.realName}.`,140,()=>{
localStorage.clear();
});

});

});

});

});

});

});

});

});

});
}


// ================= RUN =================
start();

</script>
</body>
</html>
