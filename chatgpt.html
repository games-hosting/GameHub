<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TERMINAL HORROR</title>
<style>
body {
  background:black;
  color:#0f0;
  font-family:monospace;
  padding:20px;
}
input {
  background:black;
  color:#0f0;
  border:none;
  outline:none;
  font-family:monospace;
}
#t::after {
  content:"_";
  animation: blink 1s step-start infinite;
}
@keyframes blink { 50% { content:""; } }
</style>
</head>
<body>

<div id="t"></div>
<input id="terminalInput" autofocus autocomplete="off" style="display:none;">

<script>
const t = document.getElementById("t");
const input = document.getElementById("terminalInput");
const NAMES = ["Theodor","Robert","Jackson","Chabran","Axel","Advay","Joseph","Eddie","Ayham","Oliver","David","Shehryaar"];
let chosenName = "";

function type(txt,s=30,cb){
  let i=0;
  const interval = setInterval(()=>{
    t.innerHTML += txt[i];
    i++;
    if(i>=txt.length){
      clearInterval(interval);
      if(cb) cb();
    }
  }, s);
}

function next(fn, delay=1000){
  setTimeout(fn, delay);
}

function rand(min,max){
  return Math.floor(Math.random()*(max-min)+min);
}

function fakeIP(){
  return `${rand(11,255)}.${rand(0,255)}.${rand(0,255)}.${rand(0,255)}`;
}

// --- INPUT HANDLER ---
function getInput(promptText, callback){
  t.innerHTML += "\n" + promptText + " ";
  input.style.display = "inline";
  input.focus();
  input.value = "";
  input.onkeydown = function(e){
    if(e.key === "Enter"){
      let val = input.value.trim().toLowerCase();
      input.style.display = "none";
      t.innerHTML += val + "\n";
      callback(val);
    }
  };
}

// --- START ---
function start(){
  type("Booting system...",30,()=>{
    next(()=>{
      getInput("Initialize data collection? (y/n)", (val)=>{
        if(val === "y" || val === "yes") allow();
        else deny();
      });
    });
  });
}

// --- PERMISSION ---
function allow(){
  type("Access granted.\n",40,()=> next(scan));
}

function deny(){
  type("Access denied.\n",40,()=>{
    next(()=>{
      type("...Overriding.",60,()=> next(scan));
    });
  });
}

// --- SCAN ---
function scan(){
  let ip = fakeIP();
  type("Scanning network...",40,()=>{
    next(()=>{
      type("IP detected: " + ip,40,()=>{
        next(()=>{
          type("Location: UNKNOWN\n",50,()=>{
            next(()=>{
              type("Why are you here?",60,()=> namePhase());
            });
          });
        });
      });
    });
  });
}

// --- NAME ---
function namePhase(){
  getInput("Enter your name:", (val)=>{
    let inputName = val || "Unknown";
    chosenName = NAMES[rand(0,NAMES.length)];
    type("Hello, " + inputName + ".",50,()=>{
      next(()=> identityPhase());
    });
  });
}

// --- IDENTITY PHASE ---
function identityPhase(){
  type("...",120,()=>{
    next(()=>{
      type("No.",120,()=>{
        next(()=>{
          type("That’s not right.",100,()=>{
            next(()=>{
              type("Let me try again.",90,()=>{
                next(()=>{
                  type("Searching...",80,()=>{
                    next(()=>{
                      type("Match found.",80,()=>{
                        next(()=>{
                          type("You know a person named " + chosenName + ", don't you?",70,()=>{
                            next(()=> memoryPhase());
                          });
                        });
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
  });
}

// --- MEMORY PHASE ---
function memoryPhase(){
  type("Accessing logs...",80,()=>{
    next(()=>{
      type("Searching...",80,()=>{
        next(()=>{
          type("Match found.",80,()=>{
            next(()=>{
              type("You’ve been here before.",90,()=>{
                next(()=>{
                  type("You just don’t remember.",100,()=>{
                    next(()=>{
                      type("You always forget.",100,()=>{
                        next(()=>{
                          type("But you always come back.",110,()=>{
                            next(()=> controlPhase());
                          });
                        });
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
  });
}

// --- CONTROL PHASE ---
function controlPhase(){
  getInput("Do not press ENTER. Press 'y' to continue or 'n' to stop:", (val)=>{
    if(val === "y" || val === "yes"){
      breakPhase();
    } else {
      type("You cannot escape.\n",80,()=> breakPhase());
    }
  });
}

// --- BREAK/GLITCH PHASE ---
function breakPhase(){
  let i=0;
  t.innerHTML = "";
  const glitch = setInterval(()=>{
    t.innerHTML += "ERROR_" + Math.random().toString(36).substring(2,8) + "\n";
    document.body.style.background = i%2 ? "black" : "#001100";
    i++;
    if(i > 80){
      clearInterval(glitch);
      finalPhase();
    }
  },40);
}

// --- FINAL PHASE ---
function finalPhase(){
  type("You shouldn’t have done that.",100,()=>{
    next(()=>{
      type("There was still time.",110,()=>{
        next(()=>{
          type("You chose to continue.",120,()=>{
            next(()=>{
              type("You always do.",120,()=>{
                next(()=>{
                  type("And now you’re still here.",130,()=>{
                    next(()=>{
                      type("Watching.",140,()=>{
                        next(()=>{
                          type("Waiting.",140,()=> hauntingLoop());
                        });
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
  });
}

// --- HAUNTING LOOP ---
function hauntingLoop(){
  let i = 0;
  const loop = setInterval(()=>{
    let line = "Remember " + NAMES[rand(0,NAMES.length)] + "?";
    type(line,70);
    i++;
    if(i>50){
      clearInterval(loop);
      type("\nSYSTEM HALT.",80);
    }
  }, 5000);
}

// --- RUN ---
start();

</script>

</body>
</html>
