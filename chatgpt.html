<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SYSTEM</title>
<style>
body {
  background:black;
  color:#0f0;
  font-family:monospace;
  padding:20px;
}
input,button{
  background:black;
  color:#0f0;
  border:1px solid #0f0;
}
</style>
</head>
<body>

<div id="t"></div>

<script>

const t = document.getElementById("t");

const NAMES = ["Theodor","Robert","Jackson","Chabran","Axel","Advay","Joseph","Eddie","Ayham","Oliver","David","Shehryaar"];

function type(txt,s=30,cb){
  t.innerHTML="";
  let i=0;
  let int=setInterval(()=>{
    t.innerHTML+=txt[i];
    i++;
    if(i>=txt.length){
      clearInterval(int);
      if(cb)cb();
    }
  },s);
}

function next(fn,time=1000){
  setTimeout(fn,time);
}

function rand(min,max){
  return Math.floor(Math.random()*(max-min)+min);
}

function fakeIP(){
  return `${rand(11,255)}.${rand(0,255)}.${rand(0,255)}.${rand(0,255)}`;
}

// --- START ---
function start(){

  type("Booting system...",30,()=>{
    next(()=>{
      type("Initialize data collection?",40,()=>{
        next(()=>{
          t.innerHTML += "<br><br><button onclick='allow()'>Allow</button> <button onclick='deny()'>Deny</button>";
        });
      });
    });
  });

}

// --- PERMISSION ---
function allow(){
  type("Access granted.",40,()=> next(scan));
}

function deny(){
  type("Access denied.",40,()=>{
    next(()=>{
      type("...Overriding.",60,()=> next(scan));
    });
  });
}

// --- SCAN ---
function scan(){

  let ip = fakeIP();

  type("Scanning...",40,()=>{
    next(()=>{
      type("IP detected: " + ip,40,()=>{
        next(()=>{
          type("Location: UNKNOWN",50,()=>{
            next(()=>{
              type("Why are you here?",60,()=>{
                next(nameInput);
              });
            });
          });
        });
      });
    });
  });

}

// --- NAME ---
function nameInput(){
  t.innerHTML += "<br><br>Enter your name:<br><input id='n'><button onclick='setName()'>Enter</button>";
}

function setName(){
  let input = document.getElementById("n").value || "Unknown";
  let chosen = NAMES[rand(0,NAMES.length)];

  type("Hello, " + input + ".",50,()=>{
    next(()=>{
      type("...",100,()=>{
        next(()=>{
          type("No.",100,()=>{
            next(()=>{
              type("You know a person named " + chosen + ", don't you?",70,()=>{
                next(()=>{
                  type("...or is that you?",80,()=>{
                    next(()=>{
                      type("Hello, " + chosen + ".",70);
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
  });
}

// RUN
start();

</script>

</body>
</html>
