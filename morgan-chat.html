<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morgan AI Chatbot</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.ico" type="image/x-icon">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background: #0a0a0a;
      color: #00ffff;
      font-family: 'Orbitron', monospace;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #header {
      text-align: center;
      padding: 20px;
      background: rgba(0,0,0,0.5);
      border-bottom: 2px solid #ff00ff;
      box-shadow: 0 0 30px #ff00ff;
    }
    #header h1 {
      margin: 0;
      font-size: 2.5em;
      background: linear-gradient(45deg, #ff00ff, #00ffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 80%;
      padding: 15px 20px;
      border-radius: 20px;
      font-size: 1.1em;
      line-height: 1.5;
    }
    .user {
      align-self: flex-end;
      background: #00ffff;
      color: #000;
      border-bottom-right-radius: 5px;
    }
    .morgan {
      align-self: flex-start;
      background: #ff00ff;
      color: #000;
      border-bottom-left-radius: 5px;
    }
    #input-area {
      padding: 15px;
      background: rgba(0,0,0,0.6);
      border-top: 2px solid #00ffff;
      display: flex;
      gap: 10px;
    }
    #message-input {
      flex: 1;
      padding: 15px;
      font-size: 1.2em;
      background: #111133;
      color: #00ffff;
      border: 2px solid #00ffff;
      border-radius: 50px;
      outline: none;
      font-family: 'Orbitron', monospace;
    }
    #send-btn {
      padding: 15px 30px;
      background: linear-gradient(45deg, #00ffff, #ff00ff);
      color: #000;
      border: none;
      border-radius: 50px;
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    #send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px #ff00ff;
    }
    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .typing {
      align-self: flex-start;
      color: #aaa;
      font-style: italic;
      padding: 15px 20px;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Morgan AI Chatbot</h1>
    <p>he hates ayham</p>
  </div>

  <div id="chat-container"></div>

  <div id="input-area">
    <input type="text" id="message-input" placeholder="Say something to Morgan..." autocomplete="off">
    <button id="send-btn">SEND</button>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const input = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    
    // ⬇️ Your Cloudflare Worker URL ⬇️
    const WORKER_URL = 'https://morganchatworker.theodor-rozitis.workers.dev/chat';
    
    let conversationHistory = [];
    let userName = null; // No name prompt anymore
    let isRealTheodor = localStorage.getItem('morgan_is_theodor') === 'true'; // Track if real Theodor
    let isFraud = localStorage.getItem('morgan_fraud') === 'true'; // Track if caught as fraud
    let fraudMessageCount = parseInt(localStorage.getItem('morgan_fraud_count') || '0'); // Messages since fraud caught

    // Secret creator code - only Theodor knows this
    function checkCreatorCode(message) {
      const SECRET_CODE = 'theodor2026-creator-gamehub'; // Secret code only real Theodor knows
      
      if (message.toLowerCase().trim() === SECRET_CODE) {
        isRealTheodor = true;
        isFraud = false; // Clear any fraud status
        fraudMessageCount = 0;
        localStorage.setItem('morgan_is_theodor', 'true');
        localStorage.setItem('morgan_fraud', 'false');
        localStorage.setItem('morgan_fraud_count', '0');
        return true;
      }
      return false;
    }

    // Check if someone is claiming to be Theodor without the code
    function checkForFraud(message) {
      const lowerMsg = message.toLowerCase();
      if (!isRealTheodor && (
        lowerMsg.includes("i'm theodor") || 
        lowerMsg.includes("i am theodor") ||
        lowerMsg.includes("im theodor") ||
        lowerMsg.includes("my name is theodor") ||
        lowerMsg.includes("this is theodor")
      )) {
        isFraud = true;
        fraudMessageCount = 0;
        localStorage.setItem('morgan_fraud', 'true');
        localStorage.setItem('morgan_fraud_count', '0');
        return true;
      }
      return false;
    }

    function addMessage(text, isUser = false) {
      const msg = document.createElement('div');
      msg.className = `message ${isUser ? 'user' : 'morgan'}`;
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTyping() {
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.textContent = 'Morgan is typing...';
      typing.id = 'typing-indicator';
      chatContainer.appendChild(typing);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return typing;
    }

    function removeTyping() {
      const typing = document.getElementById('typing-indicator');
      if (typing) typing.remove();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // Check for secret creator code (don't send to Morgan, just authenticate)
      if (checkCreatorCode(text)) {
        input.value = '';
        addMessage('🔓 Creator authentication successful. Welcome, Theodor.', false);
        return;
      }

      // Check if they're claiming to be Theodor without code
      if (checkForFraud(text)) {
        input.value = '';
        addMessage("🚨 FRAUD DETECTED. You're not Theodor. I refuse to talk to imposters for the next 30 messages. Nice try, clown.", false);
        return;
      }

      // If they're banned for fraud, increment counter
      if (isFraud) {
        fraudMessageCount++;
        localStorage.setItem('morgan_fraud_count', fraudMessageCount.toString());
        
        if (fraudMessageCount < 30) {
          input.value = '';
          addMessage(`🚫 Still banned. ${30 - fraudMessageCount} messages left before I talk to you again, fraud.`, false);
          return;
        } else {
          // Ban expired
          isFraud = false;
          fraudMessageCount = 0;
          localStorage.setItem('morgan_fraud', 'false');
          localStorage.setItem('morgan_fraud_count', '0');
          addMessage("Fine, your ban is over. Don't pretend to be Theodor again.", false);
        }
      }

      addMessage(text, true);
      input.value = '';
      sendBtn.disabled = true;

      // Add to conversation history
      conversationHistory.push({
        role: "user",
        content: text
      });

      // Keep only last 10 messages to prevent token overflow
      if (conversationHistory.length > 10) {
        conversationHistory = conversationHistory.slice(-10);
      }

      const typing = showTyping();

      try {
        let finalMessage = text;
        
        // Add creator status if authenticated
        if (isRealTheodor) {
          // Always let Morgan know this is the REAL Theodor
          finalMessage = `${text} [SYSTEM: This is THEODOR, your creator. He has authenticated with the secret code. Show him respect and appreciation.]`;
          conversationHistory[conversationHistory.length - 1].content = finalMessage;
        }

        // Send to Cloudflare Worker (API key is hidden there!)
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            messages: conversationHistory
          })
        });

        removeTyping();

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({ error: 'Unknown error' }));
          throw new Error(errorData.error || `Worker error: ${response.status}`);
        }

        const data = await response.json();
        
        if (!data.reply) {
          throw new Error('No reply received from Morgan');
        }
        
        const reply = data.reply;

        // Add Morgan's response to history
        conversationHistory.push({
          role: "assistant",
          content: reply
        });

        addMessage(reply);
      } catch (err) {
        removeTyping();
        
        // Check for specific error types
        let errorMessage = 'Morgan glitched out... probably your fault ayham 😭';
        
        if (err.message.includes('429') || err.message.toLowerCase().includes('rate limit')) {
          errorMessage = "you've hit the message limit bro 💀 wait till tomorrow to fuck with morgan again";
        } else if (err.message.includes('401') || err.message.toLowerCase().includes('unauthorized')) {
          errorMessage = "api key broke lmao, someone needs to fix that 🔑";
        } else if (err.message.includes('500')) {
          errorMessage = "morgan's having a mental breakdown rn, try again in a sec 🤯";
        }
        
        addMessage(errorMessage);
        console.error('Error:', err);
        
        // Remove the failed user message from history
        conversationHistory.pop();
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.onclick = sendMessage;

    input.addEventListener('keypress', e => {
      if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
    });

    // Welcome message
    addMessage("fuck you ayham jag hatar dig");
  </script>
</body>
</html>
