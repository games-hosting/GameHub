<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>S Y S T E M _ F A I L U R E</title>
    <style>
        body { margin: 0; background: #050505; color: #33ff33; font-family: 'Courier New', monospace; overflow: hidden; cursor: none; }
        canvas { display: block; image-rendering: pixelated; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; text-shadow: 2px 2px #000; }
        .glitch { animation: shake 0.2s infinite; color: #ff3333; }
        @keyframes shake {
            0% { transform: translate(0,0); }
            25% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            75% { transform: translate(2px, 2px); }
            100% { transform: translate(0,0); }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="status">LOCAL_FILES: OK</div>
        <div id="msg"></div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const msgEl = document.getElementById('msg');
const statusEl = document.getElementById('status');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Game State
const player = { x: canvas.width/2, y: canvas.height/2, size: 20, speed: 4, angle: 0 };
const monster = { x: 100, y: 100, size: 40, speed: 1.5, active: false, alpha: 0 };
let frames = 0;
let keys = {};
let glitches = [];

// Input
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => {
    player.angle = Math.atan2(e.clientY - player.y, e.clientX - player.x);
});

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    ctx.fillStyle = "#33ff33";
    // Pixel art style triangle
    ctx.fillRect(-10, -10, 20, 20);
    ctx.fillStyle = "#000";
    ctx.fillRect(5, -5, 5, 10); 
    ctx.restore();
}

function drawMonster() {
    if (!monster.active) return;
    
    ctx.save();
    ctx.globalAlpha = monster.alpha;
    // Draw the "Looming Shadow"
    ctx.fillStyle = "#000";
    ctx.shadowBlur = 15;
    ctx.shadowColor = "red";
    // Body (Elongated)
    ctx.fillRect(monster.x - 10, monster.y - 60, 20, 120);
    // Head & Glowing Eyes
    ctx.fillStyle = "#0a0a0a";
    ctx.beginPath();
    ctx.arc(monster.x, monster.y - 70, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "red";
    ctx.fillRect(monster.x - 8, monster.y - 75, 4, 4);
    ctx.fillRect(monster.x + 4, monster.y - 75, 4, 4);
    ctx.restore();
}

function update() {
    // Movement
    if (keys['w']) player.y -= player.speed;
    if (keys['s']) player.y += player.speed;
    if (keys['a']) player.x -= player.speed;
    if (keys['d']) player.x += player.speed;

    // The Weeping Angel Mechanic: Monster only moves when NOT in player's view or far away
    let dx = player.x - monster.x;
    let dy = player.y - monster.y;
    let dist = Math.sqrt(dx*dx + dy*dy);
    let angleToMonster = Math.atan2(dy, dx);
    let diff = Math.abs(player.angle - angleToMonster);

    if (diff > 1.2 || dist < 100) { 
        monster.x += Math.cos(angleToMonster) * monster.speed;
        monster.y += Math.sin(angleToMonster) * monster.speed;
        monster.alpha = Math.min(monster.alpha + 0.01, 1);
    } else {
        monster.alpha = Math.max(monster.alpha - 0.02, 0.2);
    }

    // Fourth Wall Breaks
    frames++;
    if (frames === 300) {
        statusEl.innerText = "LOCAL_FILES: CORRUPTED";
        statusEl.classList.add('glitch');
    }
    if (frames === 600) msgEl.innerText = "I SEE YOU, " + (navigator.platform || "USER");
    if (frames % 200 === 0) monster.active = true;

    // Random visual glitches
    if (Math.random() > 0.98) {
        glitches.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, w: 50, h: 5, t: 10});
    }
}

function draw() {
    // Persistent trail (makes the player doubt where they've been)
    ctx.fillStyle = "rgba(5, 5, 5, 0.1)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw glitches
    glitches.forEach((g, i) => {
        ctx.fillStyle = Math.random() > 0.5 ? "#ff0000" : "#00ff00";
        ctx.fillRect(g.x, g.y, g.w, g.h);
        g.t--;
        if (g.t <= 0) glitches.splice(i, 1);
    });

    drawMonster();
    drawPlayer();

    // Death condition
    let dist = Math.sqrt((player.x - monster.x)**2 + (player.y - monster.y)**2);
    if (dist < 30 && monster.active) {
        document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%;'>EXECUTION_SUCCESSFUL. EXE TERMINATED.</h1>";
        return;
    }

    requestAnimationFrame(() => {
        update();
        draw();
    });
}

draw();
</script>
</body>
</html>
