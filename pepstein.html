<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Five Nights at Epsteins</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1a1a1a;
      padding: 10px 20px;
      text-align: center;
      border-bottom: 2px solid #333;
    }
    .container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    button {
      background: #444;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px auto;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #666;
    }
  </style>
</head>
<body>

  <header>
    <h2>Five Nights at Epsteins</h2>
    <p>type shit</p>
  </header>

  <div class="container">
    <iframe 
      src="https://fivenightsatepsteins.org/fivenightsatepsteins-online/embed" 
      width="100%" 
      height="600" 
      frameborder="0" 
      allowfullscreen
      allow="fullscreen; autoplay; encrypted-media"
    ></iframe>
  </div>

  <button onclick="toggleFullscreen()">Go Fullscreen (Escape to exit)</button>

  <script>
    function toggleFullscreen() {
      const elem = document.querySelector('iframe');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => {
          console.log(`Fullscreen failed: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }
  </script>

</body>
</html>
