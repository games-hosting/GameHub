<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;background:#000;">
<script>
  function startSplash(callback) {
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:999999;display:flex;align-items:center;justify-content:center;';

    var img = document.createElement('img');
    img.src = 'https://i.imgur.com/7r0j2ox.png';
    img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity 1.2s ease-in-out;';
    overlay.appendChild(img);
    document.body.appendChild(overlay);

    requestAnimationFrame(function() {
      requestAnimationFrame(function() { img.style.opacity = '1'; });
    });

    setTimeout(function() {
      img.style.transition = 'opacity 1.5s ease-in-out';
      img.style.opacity = '0';
      setTimeout(function() {
        overlay.remove();
        callback();
      }, 1600);
    }, 2800);
  }

  function loadGame() {
    fetch("https://cdn.jsdelivr.net/gh/regedit-sys/web-port@main/deltarune/free.html?t=" + Date.now())
      .then(function(r) { return r.text(); })
      .then(function(html) {
        // Remove "made by bog" in all likely forms
        html = html.replace(/made by bog/gi, '');
        html = html.replace(/Made By Bog/g, '');
        html = html.replace(/MadeByBog/g, '');
        html = html.replace(/madebybog/gi, '');

        var blob = new Blob([html], { type: 'text/html' });
        location.href = URL.createObjectURL(blob);
      })
      .catch(function(e) { console.error('Failed to load game:', e); });
  }

  startSplash(loadGame);
</script>
</body>
</html>
